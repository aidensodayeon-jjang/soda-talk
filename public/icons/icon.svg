<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Antenna -->
  <rect x="246" y="70" width="20" height="46" rx="10" fill="#E2E8F0"/>
  <circle cx="256" cy="65" r="22" fill="#FBBF24" filter="url(#glow)"/>

  <!-- Ears / Headphones -->
  <rect x="68" y="190" width="34" height="96" rx="17" fill="#E2E8F0"/>
  <rect x="410" y="190" width="34" height="96" rx="17" fill="#E2E8F0"/>

  <!-- Robot Head / Body Outer -->
  <rect x="92" y="110" width="328" height="260" rx="64" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="6"/>

  <!-- Robot Screen -->
  <rect x="124" y="142" width="264" height="196" rx="40" fill="url(#screenGrad)"/>

  <!-- Robot Glowing Eyes -->
  <ellipse cx="196" cy="230" rx="26" ry="34" fill="url(#eyeGrad)" filter="url(#glow)"/>
  <ellipse cx="316" cy="230" rx="26" ry="34" fill="url(#eyeGrad)" filter="url(#glow)"/>

  <!-- Eye Highlights -->
  <circle cx="188" cy="216" r="8" fill="#FFFFFF"/>
  <circle cx="308" cy="216" r="8" fill="#FFFFFF"/>

  <!-- Robot Smile -->
  <path d="M 224 282 Q 256 308 288 282" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Bottom Accent / Cheeks -->
  <circle cx="160" cy="272" r="10" fill="#F43F5E" opacity="0.75"/>
  <circle cx="352" cy="272" r="10" fill="#F43F5E" opacity="0.75"/>

  <!-- App Label Badge at bottom -->
  <rect x="136" y="400" width="240" height="54" rx="27" fill="#FFFFFF" opacity="0.95"/>
  <text x="256" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#1D4ED8" text-anchor="middle" letter-spacing="2">SODABOT</text>
</svg>
